# Deploy = upload the locally generated site:
#   yarn content && NUXT_PUBLIC_SITE_URL=https://<site>.netlify.app yarn generate
#   npx netlify deploy --prod --dir .output/public
# No build command on purpose: images (public/media) and legacy sources are gitignored,
# a Git-triggered Netlify build would publish the site without photos.
[build]
  publish = ".output/public"

[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/media/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/_nuxt/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
